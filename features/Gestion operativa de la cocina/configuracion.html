<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración - FoodFinder</title>
    <link rel="stylesheet" href="../../styles.css">
</head>
<body>

    <!-- CABECERA -->
    <header class="cabecera_plataforma">
        <img src="../../Assests/Icons/FF_Logo_Coci.png" alt="logo_consumidor">
        <div class="usuario_bloque">
            <button id="btn_Dashboard">Dashboard</button>
            <img src="../../Assests/Icons/perfil.png" alt="usuario" style="width:36px; height:36px; border-radius:50%; object-fit:cover;">
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <div id="contenedor-principal">

        <!-- SIDEBAR (escritorio) -->
        <nav>
            <h5>PANEL DE GESTIÓN</h5>

            <div class="btn">
                <img class="sidebar-icon" src="../../Assests/Icons/home.png" alt="icono resumen">
                <a class="sidebar-link" href="pedidos_entrantes.html">Resumen</a>
            </div>
            <div class="btn">
                <img class="sidebar-icon" src="../../Assests/Icons/campana.png" alt="icono pedidos">
                <a class="sidebar-link" href="pedidos_entrantes.html">Pedidos entrantes</a>
            </div>
            <div class="btn">
                <img class="sidebar-icon" src="../../Assests/icons/Mis platos.png" alt="icono mis platos">
                <a class="sidebar-link" href="mis_platos.html">Mis Platos</a>
            </div>
            <div class="btn">
                <img class="sidebar-icon" src="../../Assests/icons/caja.png" alt="icono inventario">
                <a class="sidebar-link" href="Inventario.html">Inventario</a>
            </div>
            <div class="btn">
                <img class="sidebar-icon" src="../../Assests/icons/estadistica.png" alt="icono estadísticas">
                <a class="sidebar-link" href="#">Estadísticas</a>
            </div>
            <div class="btn activo">
                <img class="sidebar-icon" src="../../Assests/Icons/ajuste.png" alt="icono configuración">
                <a class="sidebar-link" href="configuracion.html">Configuración</a>
            </div>
        </nav>

        <!-- CONTENIDO PRINCIPAL -->
        <main>
            <h1>Configuración</h1>

            <div class="config-sections-wrapper">

                <!-- SECCIÓN: Información del restaurante -->
                <div class="config-section">
                    <h2 class="config-section-titulo">Información del restaurante</h2>

                    <div class="form-field">
                        <label class="form-label" for="nombre-restaurante">Nombre del restaurante</label>
                        <input class="form-input" type="text" id="nombre-restaurante">
                    </div>

                    <div class="form-field">
                        <label class="form-label" for="descripcion">Descripción</label>
                        <textarea class="form-input textarea" id="descripcion" rows="3"></textarea>
                    </div>

                    <div class="fila-inferior">
                        <div class="campo-telefono">
                            <label class="campo-telefono-label" for="telefono">Teléfono</label>
                            <input class="campo-telefono-input" type="tel" id="telefono" placeholder="+51 999 999 999">
                        </div>

                        <div class="adjuntar-grupo">
                            <div class="adjuntar-item">
                                <label class="adjuntar-label">Añadir/actualizar foto del restaurante</label>
                                <button class="btn-adjuntar" id="btn-foto">Adjuntar foto</button>
                                <input type="file" id="input-foto" accept="image/*" style="display:none;">
                            </div>
                            <div class="adjuntar-item">
                                <label class="adjuntar-label">Añadir/actualizar logo del restaurante</label>
                                <button class="btn-adjuntar" id="btn-logo">Adjuntar logo</button>
                                <input type="file" id="input-logo" accept="image/*" style="display:none;">
                            </div>
                        </div>
                    </div>

                    <button class="btn-guardar" id="btn-guardar-info">Guardar cambios</button>
                </div>

                <!-- SECCIÓN: Horario de atención -->
                <div class="config-section">
                    <h2 class="config-section-titulo">Horario de atención</h2>

                    <div class="horario-fila">
                        <span class="horario-dia">Lunes — Viernes</span>
                        <div class="horario-inputs">
                            <input class="horario-time" type="time" id="lv-inicio" value="08:00">
                            <span class="separador-hora">—</span>
                            <input class="horario-time" type="time" id="lv-fin" value="22:00">
                        </div>
                        <div class="cerrado-toggle">
                            <label class="toggle-switch">
                                <input class="toggle-input" type="checkbox" id="toggle-lv">
                                <span class="toggle-track"></span>
                            </label>
                            <span class="cerrado-texto">Cerrado</span>
                        </div>
                    </div>

                    <div class="horario-fila">
                        <span class="horario-dia">Sábado</span>
                        <div class="horario-inputs">
                            <input class="horario-time" type="time" id="sa-inicio" value="09:00">
                            <span class="separador-hora">—</span>
                            <input class="horario-time" type="time" id="sa-fin" value="22:00">
                        </div>
                        <div class="cerrado-toggle">
                            <label class="toggle-switch">
                                <input class="toggle-input" type="checkbox" id="toggle-sa">
                                <span class="toggle-track"></span>
                            </label>
                            <span class="cerrado-texto">Cerrado</span>
                        </div>
                    </div>

                    <div class="horario-fila">
                        <span class="horario-dia">Domingo</span>
                        <div class="horario-inputs">
                            <input class="horario-time" type="time" id="do-inicio" value="10:00">
                            <span class="separador-hora">—</span>
                            <input class="horario-time" type="time" id="do-fin" value="20:00">
                        </div>
                        <div class="cerrado-toggle">
                            <label class="toggle-switch">
                                <input class="toggle-input" type="checkbox" id="toggle-do">
                                <span class="toggle-track"></span>
                            </label>
                            <span class="cerrado-texto">Cerrado</span>
                        </div>
                    </div>

                    <button class="btn-actualizar" id="btn-actualizar-horarios">Actualizar horarios</button>
                </div>

            </div>
        </main>
    </div>

    <!-- NAVEGACIÓN INFERIOR (solo móvil) -->
    <nav class="nav-mobile">
        <a class="nav-mobile-item" href="pedidos_entrantes.html">
            <img class="nav-mobile-icon" src="../../Assests/Icons/home.png" alt="Resumen">
            <span>Resumen</span>
        </a>
        <a class="nav-mobile-item" href="pedidos_entrantes.html">
            <img class="nav-mobile-icon" src="../../Assests/Icons/campana.png" alt="Pedidos">
            <span>Pedidos</span>
        </a>
        <a class="nav-mobile-item" href="mis_platos.html">
            <img class="nav-mobile-icon" src="../../Assests/icons/Mis platos.png" alt="Platos">
            <span>Platos</span>
        </a>
        <a class="nav-mobile-item" href="Inventario.html">
            <img class="nav-mobile-icon" src="../../Assests/icons/caja.png" alt="Inventario">
            <span>Inventario</span>
        </a>
        <a class="nav-mobile-item activo" href="configuracion.html">
            <img class="nav-mobile-icon" src="../../Assests/Icons/ajuste.png" alt="Config">
            <span>Config</span>
        </a>
    </nav>

    <!-- TOAST -->
    <div class="toast" id="toast"></div>

    <script src="configuracion.js"></script>
</body>
</html>
