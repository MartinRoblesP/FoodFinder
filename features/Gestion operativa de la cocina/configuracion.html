<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración - FoodFinder</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

    <header class="cabecera_plataforma">
        <img src="/Assests/Icons/FF_Logo_Coci.png" alt="logo_consumidor">
        <div class="usuario_bloque">
            <button id="btn_Dashboard">Dashboard</button>
            <img src="/Assests/Icons/perfil.png" alt="usuario" style="width:36px; height:36px; border-radius:50%; object-fit:cover;">
        </div>
    </header>


    <div id="contenedor-principal">

    
        <nav>
            <h5>PANEL DE GESTIÓN</h5>

            <div class="btn">
                <img src="/Assests/Icons/home.png" alt="icono resumen" style="width:18px;height:18px;">
                <a href="../Gestion operativa de la cocina/pedidos_entrantes.html">Resumen</a>
            </div>

            <div class="btn">
                <img src="/Assests/Icons/campana.png" alt="icono pedidos" style="width:18px;height:18px;">
                <a href="../Gestion operativa de la cocina/pedidos_entrantes.html">Pedidos entrantes</a>
            </div>

            <div class="btn">
                <img src="/Assests/icons/Mis platos.png" alt="icono mis platos" style="width:18px;height:18px;">
                <a href="../Gestion operativa de la cocina/mis_platos.html">Mis Platos</a>
            </div>

            <div class="btn">
                <img src="/Assests/icons/caja.png" alt="icono inventario" style="width:18px;height:18px;">
                <a href="../Gestion operativa de la cocina/Inventario.html">Inventario</a>
            </div>

            <div class="btn">
                <img src="/Assests/icons/estadistica.png" alt="icono estadísticas" style="width:18px;height:18px;">
                <a href="#">Estadísticas</a>
            </div>

            <div class="btn activo">
                <img src="/Assests/Icons/ajuste.png" alt="icono configuración" style="width:18px;height:18px;">
                <a href="configuracion.html">Configuración</a>
            </div>
        </nav>

        <main>
            <h1>Configuración</h1>

            <div class="config-sections-wrapper">

                <!-- SECCIÓN: Información del restaurante -->
                <div class="config-section">
                    <h2>Información del restaurante</h2>

                    <!-- Nombre -->
                    <div class="form-field">
                        <label for="nombre-restaurante">Nombre del restaurante</label>
                        <input type="text" id="nombre-restaurante" value="El Rincón del Sabor">
                    </div>

                    <!-- Descripción -->
                    <div class="form-field">
                        <label for="descripcion">Descripción</label>
                        <textarea id="descripcion" rows="3">Sabores peruanos auténticos...</textarea>
                    </div>

                    <!-- Fila: Teléfono + Adjuntar foto/logo -->
                    <div class="fila-inferior">
                        <div class="campo-telefono">
                            <label for="telefono">Teléfono</label>
                            <input type="tel" id="telefono" placeholder="+51 999 999 999">
                        </div>

                        <div class="adjuntar-grupo">
                            <div class="adjuntar-item">
                                <label>Añadir/actualizar foto del restaurante</label>
                                <button class="btn-adjuntar" onclick="document.getElementById('input-foto').click()">
                                    Adjuntar foto
                                </button>
                                <input type="file" id="input-foto" accept="image/*" style="display:none;">
                            </div>

                            <div class="adjuntar-item">
                                <label>Añadir/actualizar logo del restaurante</label>
                                <button class="btn-adjuntar" onclick="document.getElementById('input-logo').click()">
                                    Adjuntar logo
                                </button>
                                <input type="file" id="input-logo" accept="image/*" style="display:none;">
                            </div>
                        </div>
                    </div>

                    <button class="btn-guardar">Guardar cambios</button>
                </div>

                <!--  Horario de atención -->
                <div class="config-section">
                    <h2>Horario de atención</h2>

                    <!-- Lunes - Viernes -->
                    <div class="horario-fila">
                        <span class="horario-dia">Lunes — Viernes</span>
                        <div class="horario-inputs">
                            <input type="time" value="08:00">
                            <span class="separador-hora">—</span>
                            <input type="time" value="22:00">
                        </div>
                        <div class="cerrado-toggle">
                            <label class="toggle-switch">
                                <input type="checkbox">
                                <span class="toggle-track"></span>
                            </label>
                            <span>Cerrado</span>
                        </div>
                    </div>

                    <!-- Sábado -->
                    <div class="horario-fila">
                        <span class="horario-dia">Sábado</span>
                        <div class="horario-inputs">
                            <input type="time" value="09:00">
                            <span class="separador-hora">—</span>
                            <input type="time" value="22:00">
                        </div>
                        <div class="cerrado-toggle">
                            <label class="toggle-switch">
                                <input type="checkbox">
                                <span class="toggle-track"></span>
                            </label>
                            <span>Cerrado</span>
                        </div>
                    </div>

                    <!-- Domingo -->
                    <div class="horario-fila">
                        <span class="horario-dia">Domingo</span>
                        <div class="horario-inputs">
                            <input type="time" value="10:00">
                            <span class="separador-hora">—</span>
                            <input type="time" value="20:00">
                        </div>
                        <div class="cerrado-toggle">
                            <label class="toggle-switch">
                                <input type="checkbox">
                                <span class="toggle-track"></span>
                            </label>
                            <span>Cerrado</span>
                        </div>
                    </div>

                    <button class="btn-actualizar">Actualizar horarios</button>
                </div>

            </div>
        </main>
    </div>

</body>
</html>
